jt680x|subdir|https://github.com/jotego/jtcores.git|3278a82b948a91c23a8d2165a5ae545a6dae8994:modules/jt680x/hdl|rtl/third_party/jt680x|GPL-3.0-or-later|jt6805, Jose Tejada's 6805 CPU core, used ONLY by tharrierb's MC68705R3 (rtl/m68705). There is no standalone jotego/jt680x repo (404) -- it is a module of the jtcores monorepo, so this is a `subdir` entry: a blob-filtered sparse depth-1 fetch of modules/jt680x/hdl, landing at rtl/third_party/jt680x/hdl. Provenance CONFIRMED 2026-09-14 against the GitHub API: 3278a82 ("cosmetic: simplified license headers", 2026-08-21) is the most recent commit touching each of the four files, and its blobs are byte-identical to the ones vendored here --
#   jt6805.v      45e4f9133e1b6252d9f71218adeece72b419a316
#   jt6805_alu.v  361e15010e7a5f7bebd1f9770478401207f7f9f8
#   jt6805_ctrl.v c0a2f4234a6bee49d721f521395c77bf99269063
#   jt6805_regs.v be85639b522b92b73d1bf02022b78a7b1c5b3068
# That commit is after jotego's own "jt6805: fixed ASR, which had wrong MSB" (910830129acc, 2024-12-04), so this copy has that fix.
# NB the microcode this core runs is NOT jotego's: rtl/m68705/6805.uc is this project's own (see README). His source for it IS upstream, at modules/jt680x/ucode/6805.yaml -- not vendored, because the `jtframe ucode` generator that consumes it is not either. Ours is verified against MAME's m6805 instead (960,794 instructions, zero mismatches; sim/rtl/m68705).
sdram|file|https://github.com/rmonic79/Arcade-Darius_MiSTer.git|HEAD:rtl/sdram.sv|rtl/sdram.sv|GPL-3.0-or-later (per file header, Copyright (c) 2018 Sorgelig)|No standalone upstream repo exists for this file — it's copy-pasted core-to-core. Seeded from this specific known-good copy, original blob e4228fb9bb0787f78e6a0f3bfcdc4399d89945c4 (re-checked 2026-09-14: that is still what upstream HEAD holds, and it matched Arcade-HeatedBarrel_MiSTer's copy too).
# *** THIS ONE IS MODIFIED AND TRACKED IN GIT, unlike every other entry here. ***
# Local blob is e94504bd4a77bff70048a18bcdf2cabf4a59c8bd. This project added a
# REFRESH_CYCLES parameter, a prio_mode port (round-robin / video-first /
# CPU-first / video-75%) and dout*_pair, which returns two words per read
# transaction. See commits 1826172, 9b54f5b, 61aa1b9, 5026368. bootstrap.sh
# skips it because the file already exists; do NOT delete it to force a
# re-fetch, that would silently revert those changes and break every core.
hiscore|repo|https://github.com/MiSTer-devel/Hiscores_MiSTer.git|31789f3b6bf61c379117f73adc879e3c9d5873ae|rtl/third_party/hiscore|GPL-3.0-or-later|MAME hiscore.dat save/load module (Alan Steremberg, Jim Gregory). MODIFIED, like rtl/sdram.sv: dpram_hs is rewritten to a template Quartus will infer as M10K. Upstream writes both ports from one always block with write-through, which at the HS_SCOREWIDTH=13 this core needs built 69,685 ALUTs of logic and would not fit; upstream cores use width 8 where that costs nothing. Also ties off hiscore_buffer's unconnected port B. Semantics unchanged. It muxes onto the core's existing game-RAM port under pause_cpu, so no extra M10K read port (NMK-10).
